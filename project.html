<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <!-- Dynamic SEO (updated via JS) -->
  <title id="pageTitle">Project | Muhammad Akif Jan</title>
  <meta name="description" id="pageDescription" content="Data analytics project case study by Muhammad Akif Jan.">
  
  <!-- Open Graph Tags -->
  <meta property="og:title" id="ogTitle" content="Project | Muhammad Akif Jan">
  <meta property="og:description" id="ogDescription" content="Data analytics project case study.">
  <meta property="og:type" content="article">
  <meta property="og:image" id="ogImage" content="">
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  
  <!-- Canonical URL -->
  <link rel="canonical" id="canonicalUrl" href="">
  
  <!-- Schema.org CreativeWork -->
  <script type="application/ld+json" id="schemaData">
  {
    "@context": "https://schema.org",
    "@type": "CreativeWork",
    "name": "Project Case Study",
    "creator": { "@type": "Person", "name": "Muhammad Akif Jan" }
  }
  </script>
  
  <!-- Premium fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    /* ========== SHARED STYLES ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #F5F5F0;
      --bg-card: #FFFFFF;
      --bg-secondary: #E6D8C3;
      --accent: #5D866C;
      --accent-secondary: #C2A68C;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --border: rgba(93, 134, 108, 0.15);
      --border-light: rgba(93, 134, 108, 0.08);
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
      --shadow-md: 0 12px 28px rgba(0,0,0,0.04), 0 0 1px rgba(0,0,0,0.04);
      --shadow-lg: 0 24px 48px -12px rgba(0,0,0,0.06);
      --radius-xs: 0.5rem;
      --radius-sm: 0.75rem;
      --radius-md: 1rem;
      --radius-lg: 1.5rem;
      --radius-xl: 2rem;
      --transition-smooth: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    html { scroll-behavior: smooth; font-size: 16px; background-color: var(--bg-primary); }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }

    h1, h2, h3 {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 500;
      line-height: 1.15;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
    }

    h3 {
      font-size: 1.5rem;
      margin-bottom: 0.8rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 2.5rem;
    }

    .section-tag {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: var(--accent);
      margin-bottom: 1rem;
      font-weight: 500;
    }

    /* ========== NAVIGATION ========== */
    .navbar {
      position: sticky;
      top: 1.5rem;
      margin: 1.5rem auto 0;
      max-width: 820px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 3rem;
      padding: 0.75rem 2.4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 999;
      box-shadow: var(--shadow-sm);
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 1.7rem;
      color: var(--text-primary);
      text-decoration: none;
    }

    .nav-back {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .nav-back:hover { color: var(--accent); }

    /* ========== BUTTONS ========== */
    .btn {
      padding: 0.85rem 2.2rem;
      border-radius: 2.5rem;
      font-weight: 500;
      font-size: 0.9rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition-smooth);
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      background-color: var(--bg-card);
      letter-spacing: -0.01em;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: #4a7357;
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn-outline:hover {
      background: var(--bg-card);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* ========== HERO IMAGE ========== */
    .hero-image {
      width: 100%;
      height: 400px;
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin: 2rem 0 3rem;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ========== PROJECT HEADER ========== */
    .project-header {
      padding: 2rem 0 1rem;
    }

    .project-header h1 {
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      margin-bottom: 1rem;
    }

    .project-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem 0;
    }

    .project-tag {
      background: var(--bg-secondary);
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* ========== CONTENT SECTIONS ========== */
    .content-section {
      padding: 2rem 0;
      border-bottom: 1px solid var(--border-light);
    }

    .content-section:last-child {
      border-bottom: none;
    }

    .content-section p {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 1rem;
    }

    .content-section ul {
      list-style: none;
      padding: 0;
    }

    .content-section ul li {
      padding: 0.5rem 0;
      color: var(--text-secondary);
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
    }

    .content-section ul li i {
      color: var(--accent);
      margin-top: 0.3rem;
    }

    /* ========== GALLERY ========== */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .gallery-item {
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--bg-secondary);
      aspect-ratio: 16/10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
    }

    /* ========== NAVIGATION BETWEEN PROJECTS ========== */
    .project-navigation {
      display: flex;
      justify-content: space-between;
      padding: 3rem 0;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .nav-project {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
      font-size: 0.9rem;
    }

    .nav-project:hover {
      color: var(--accent);
    }

    /* ========== FOOTER ========== */
    .footer {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-light);
      font-size: 0.9rem;
    }

    /* ========== SKELETON LOADING ========== */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .container { padding: 0 1.5rem; }
      .navbar { padding: 0.7rem 1.5rem; top: 1rem; }
      .hero-image { height: 250px; border-radius: var(--radius-lg); }
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- ========== NAVIGATION ========== -->
  <nav class="navbar">
    <a href="index.html" class="nav-logo">M Akif.</a>
    <a href="projects.html" class="nav-back"><i class="fas fa-arrow-left"></i> Back to Projects</a>
  </nav>

  <main>
    <div class="container">
      <!-- ========== PROJECT HEADER ========== -->
      <article id="projectContent">
        <!-- Skeleton loading state -->
        <div class="project-header">
          <div class="section-tag skeleton" style="width:120px;height:16px;"></div>
          <div class="skeleton" style="width:80%;height:48px;margin-bottom:1rem;"></div>
          <div class="skeleton" style="width:60%;height:20px;"></div>
        </div>
        <div class="hero-image skeleton" style="height:400px;"></div>
        <div class="content-section">
          <div class="skeleton" style="width:40%;height:32px;margin-bottom:1rem;"></div>
          <div class="skeleton" style="width:100%;height:16px;margin-bottom:0.5rem;"></div>
          <div class="skeleton" style="width:90%;height:16px;margin-bottom:0.5rem;"></div>
          <div class="skeleton" style="width:70%;height:16px;"></div>
        </div>
      </article>
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 Muhammad Akif Jan — Precision in data, clarity in design.</p>
  </footer>

  <script src="projects-data.js"></script>
  <script>
    /**
     * ====================================================
     * PROJECT.JS - Dynamic Case Study Page
     * ====================================================
     */
    
    /**
     * Get project ID from URL parameters
     */
    function getProjectId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    /**
     * Find project by ID in the loaded data
     */
    function findProject(projects, id) {
      return projects.find(p => p.id === id) || projects[0];
    }

    /**
     * Get adjacent projects for navigation
     */
    function getAdjacentProjects(projects, currentId) {
      const index = projects.findIndex(p => p.id === currentId);
      return {
        previous: index > 0 ? projects[index - 1] : null,
        next: index < projects.length - 1 ? projects[index + 1] : null
      };
    }

    /**
     * Update SEO meta tags dynamically
     */
    function updateSEO(project) {
      document.title = `${project.title} | Muhammad Akif Jan - Data Analyst`;
      
      const description = project.shortDescription || project.description || '';
      document.getElementById('pageDescription')?.setAttribute('content', description);
      document.getElementById('ogTitle')?.setAttribute('content', `${project.title} | Muhammad Akif Jan`);
      document.getElementById('ogDescription')?.setAttribute('content', description);
      document.getElementById('ogImage')?.setAttribute('content', project.heroImage || '');
      
      const canonicalUrl = `https://akifjan.github.io/portfolio/project.html?id=${project.id}`;
      document.getElementById('canonicalUrl')?.setAttribute('href', canonicalUrl);
      
      // Update Schema.org data
      const schemaEl = document.getElementById('schemaData');
      if (schemaEl) {
        const schema = {
          "@context": "https://schema.org",
          "@type": "CreativeWork",
          "name": project.title,
          "description": description,
          "creator": { "@type": "Person", "name": "Muhammad Akif Jan" },
          "keywords": (project.tools || []).join(', ')
        };
        schemaEl.textContent = JSON.stringify(schema);
      }
    }

    /**
     * Render the full project page
     */
    function renderProject(project, adjacentProjects) {
      const container = document.getElementById('projectContent');
      
      // Generate gallery HTML
      const galleryHTML = (project.gallery && project.gallery.length > 0)
        ? `
          <div class="content-section">
            <h2>Dashboard Gallery</h2>
            <div class="gallery-grid">
              ${project.gallery.map(img => `
                <div class="gallery-item">
                  <img src="${img}" alt="${project.title} dashboard screenshot" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fas fa-chart-bar\\' style=\\'font-size:2rem;color:var(--accent);\\'></i>';">
                </div>
              `).join('')}
            </div>
          </div>
        ` : '';
      
      // Generate KPI list
      const kpisHTML = (project.kpis && project.kpis.length > 0)
        ? `
          <div class="content-section">
            <h2>Key Performance Indicators</h2>
            <ul>
              ${project.kpis.map(kpi => `<li><i class="fas fa-chart-line"></i> ${kpi}</li>`).join('')}
            </ul>
          </div>
        ` : '';
      
      // Generate insights
      const insightsHTML = (project.insights && project.insights.length > 0)
        ? `
          <div class="content-section">
            <h2>Business Insights</h2>
            <ul>
              ${project.insights.map(insight => `<li><i class="fas fa-lightbulb"></i> ${insight}</li>`).join('')}
            </ul>
          </div>
        ` : '';
      
      // Generate recommendations
      const recommendationsHTML = (project.recommendations && project.recommendations.length > 0)
        ? `
          <div class="content-section">
            <h2>Recommendations</h2>
            <ul>
              ${project.recommendations.map(rec => `<li><i class="fas fa-check-circle"></i> ${rec}</li>`).join('')}
            </ul>
          </div>
        ` : '';
      
      // Main content
      container.innerHTML = `
        <div class="project-header fade-in">
          <div class="section-tag">${project.category || 'Project'}</div>
          <h1>${project.title}</h1>
          <div class="project-meta">
            ${(project.tools || []).map(tool => `<span class="project-tag">${tool}</span>`).join('')}
          </div>
        </div>
        
        <div class="hero-image fade-in">
          ${project.heroImage 
            ? `<img src="${project.heroImage}" alt="${project.title}" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fas fa-chart-bar\\' style=\\'font-size:4rem;color:var(--accent);\\'></i>';">`
            : '<i class="fas fa-chart-bar" style="font-size:4rem;color:var(--accent);"></i>'
          }
        </div>
        
        <div class="content-section fade-in">
          <h2>Business Problem</h2>
          <p>${project.businessProblem || 'Not specified.'}</p>
        </div>
        
        ${project.objective ? `
        <div class="content-section fade-in">
          <h2>Objective</h2>
          <p>${project.objective}</p>
        </div>
        ` : ''}
        
        ${project.dataset ? `
        <div class="content-section fade-in">
          <h2>Dataset</h2>
          <p>${project.dataset}</p>
        </div>
        ` : ''}
        
        ${project.dataModeling ? `
        <div class="content-section fade-in">
          <h2>Data Modeling</h2>
          <p>${project.dataModeling}</p>
        </div>
        ` : ''}
        
        ${kpisHTML}
        ${galleryHTML}
        ${insightsHTML}
        ${recommendationsHTML}
        
        ${project.challenges ? `
        <div class="content-section fade-in">
          <h2>Challenges</h2>
          <p>${project.challenges}</p>
        </div>
        ` : ''}
        
        ${project.outcome ? `
        <div class="content-section fade-in">
          <h2>Outcome</h2>
          <p>${project.outcome}</p>
        </div>
        ` : ''}
        
        <div class="content-section fade-in" style="border-bottom:none;">
          <div class="btn-group">
            ${project.github && project.github !== '#' ? `<a href="${project.github}" class="btn btn-outline" target="_blank" rel="noopener"><i class="fab fa-github"></i> View on GitHub</a>` : ''}
            ${project.download && project.download !== '#' ? `<a href="${project.download}" class="btn btn-outline"><i class="fas fa-download"></i> Download PBIX</a>` : ''}
            <a href="projects.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> All Projects</a>
          </div>
        </div>
        
        <!-- Previous / Next Navigation -->
        <div class="project-navigation fade-in">
          ${adjacentProjects.previous 
            ? `<a href="project.html?id=${adjacentProjects.previous.id}" class="nav-project"><i class="fas fa-arrow-left"></i> Previous: ${adjacentProjects.previous.title}</a>`
            : '<span></span>'
          }
          ${adjacentProjects.next 
            ? `<a href="project.html?id=${adjacentProjects.next.id}" class="nav-project">Next: ${adjacentProjects.next.title} <i class="fas fa-arrow-right"></i></a>`
            : '<span></span>'
          }
        </div>
      `;
      
      // Add fade-in animation to sections
      setTimeout(() => {
        document.querySelectorAll('.fade-in').forEach(el => {
          el.style.opacity = '1';
          el.style.transform = 'translateY(0)';
        });
      }, 100);
    }

    /**
     * Initialize the page
     */
    async function initProjectPage() {
      const projectId = getProjectId();
      
      try {
        let data = null;

        try {
          const response = await fetch('projects.json', { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          data = await response.json();
        } catch (fetchError) {
          console.warn('Falling back to embedded project data:', fetchError);
          data = window.PROJECTS_DATA || null;
        }

        if (!data || !Array.isArray(data.projects)) {
          throw new Error('No project data available');
        }

        const projects = data.projects || [];
        
        // Sort by date
        projects.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        const project = findProject(projects, projectId);
        const adjacentProjects = getAdjacentProjects(projects, project.id);
        
        // Update SEO
        updateSEO(project);
        
        // Render the page
        renderProject(project, adjacentProjects);
        
        // Add fade-in styles dynamically
        const style = document.createElement('style');
        style.textContent = `
          .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
          }
        `;
        document.head.appendChild(style);
        
      } catch (error) {
        console.error('Error loading project:', error);
        document.getElementById('projectContent').innerHTML = `
          <div style="text-align:center;padding:4rem;">
            <i class="fas fa-exclamation-circle" style="font-size:3rem;color:var(--accent);margin-bottom:1rem;display:block;"></i>
            <h2>Unable to load project</h2>
            <p style="color:var(--text-secondary);">Please check your connection and try again.</p>
            <a href="projects.html" class="btn btn-outline" style="margin-top:1.5rem;">Back to Projects</a>
          </div>
        `;
      }
    }

    // --- Initialize on page load ---
    document.addEventListener('DOMContentLoaded', initProjectPage);
  </script>
</body>
</html>
